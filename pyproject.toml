[project]
name = "nws-slack-forecast"
version = "0.1.0"
description = "A cron-friendly daily National Weather Service forecast for Slack"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1,<1",
    "python-dotenv>=1.1.1,<2",
    "tzdata>=2025.2",
]

[project.scripts]
nws-forecast = "nws_forecast.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nws_forecast"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests/.tmp/", "/tests/.uv-cache/"]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
